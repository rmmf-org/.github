name: Bug report
description: Something is broken or behaves differently from what you expect.
title: "Bug: "
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please check open issues first to avoid duplicates.
        **Security issues:** do not file them here. Email support@roubenmalianmemorial.org instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Where did you see the problem? Select all that apply.
      multiple: true
      options:
        - iPhone (iOS)
        - iPad (iPadOS)
        - Mac (macOS)
        - Apple Watch (watchOS)
        - Apple TV (tvOS)
        - Android
        - Website / browser
        - API / Cloudflare Worker
        - MCP server
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: App version and build, OS version, or browser and version.
      placeholder: "e.g. 2.0 (build 10), iOS 26.1 / Safari 26"
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Paste relevant log output (it is formatted as code automatically). Remove any personal data, tokens or keys first.
      render: shell
