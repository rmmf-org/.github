name: Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "Feature: "
type: Feature
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom? Describe the need, not the solution.
      placeholder: As a <user>, I can't <do something>, so <consequence>.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have considered.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this is done?
      value: |
        - [ ] 
        - [ ] 
    validations:
      required: true
